<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Ordering</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav><a class="logo" href="#">Campus Bites</a><a href="#menu">Menu</a><a href="#cart">Cart (<span id="cartCount">0</span>)</a></nav></header><main><section class="hero"><h1>Good food, good mood.</h1><p>Choose your favourites and review your order.</p></section><section id="menu"><h2>Our Menu</h2><div id="foodGrid" class="cards"></div></section><section id="cart"><h2>Your Cart</h2><ul id="cartList" class="expense-list"></ul><h3 id="cartTotal">Total: ₹0.00</h3><button id="placeOrder" class="btn">Place Demo Order</button><p id="orderMessage" role="status"></p></section></main>
