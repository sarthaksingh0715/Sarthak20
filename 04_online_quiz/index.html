<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="quiz-wrap"><section class="panel"><p class="eyebrow">TEST YOUR KNOWLEDGE</p><h1>Web Basics Quiz</h1><div id="quiz"><p id="progress"></p><h2 id="question"></h2><div id="answers" class="answer-list"></div><p id="feedback" role="status"></p><div class="actions"><button id="prev" class="btn secondary">Previous</button><button id="next" class="btn">Next</button></div></div><div id="result" hidden><h2>Quiz completed!</h2><p id="score"></p><button id="restart" class="btn">Restart Quiz</button></div></section></main>
<script src="script.js" defer></script>
</body>
</html>
