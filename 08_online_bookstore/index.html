<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Bookstore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav><a class="logo" href="#">PageTurner</a><a href="#books">Books</a><a href="#cart">Cart (<span id="cartCount">0</span>)</a></nav></header><main><section class="hero"><h1>Find your next read</h1><p>Browse a small student-friendly book collection.</p></section><section id="books"><h2>Bookstore</h2><div class="toolbar"><input id="search" placeholder="Search title or author"><select id="category"><option value="All">All categories</option><option>Technology</option><option>Fiction</option><option>Science</option></select></div><div id="bookGrid" class="cards"></div></section><section id="cart"><h2>Shopping Cart</h2><ul id="cartList" class="expense-list"></ul><h3 id="total">Total: ₹0.00</h3></section></main>
<script src="script.js" defer></script>
</body>
</html>
